<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciamento — ai-memory</title><link rel="icon" href="{{ root }}/static/logo.png"><link rel="stylesheet" href="{{ root }}/static/tailwind.css">
<script>{{ script|safe }}</script></head>
<body class="management min-h-screen"><header class="management-header border-b"><div class="max-w-6xl mx-auto px-6 py-5 flex flex-wrap justify-between items-center gap-4">
<a class="management-brand flex items-center gap-3" href="{{ root }}/sessions"><img src="{{ root }}/static/logo.png" class="h-10 w-10" alt=""><strong>ai-memory</strong><span class="management-muted text-sm">Gerenciamento</span></a>
<div class="flex flex-wrap items-center gap-4"><div role="group" aria-label="Tema de cores" class="management-themes"><button type="button" data-theme="system">Sistema</button><button type="button" data-theme="light">Claro</button><button type="button" data-theme="dark">Escuro</button></div>
{% if !username.is_empty() %}<span>{{ username }} · {% if admin %}Admin{% else %}Usuário{% endif %}</span><form action="{{ root }}/action" method="post"><input type="hidden" name="action" value="logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Sair</button></form>{% endif %}
</div></div></header>
<main class="max-w-6xl mx-auto px-6 py-8" id="main-content">
{% if !username.is_empty() %}<nav aria-label="Gerenciamento" class="flex flex-wrap gap-3 mb-8"><a href="{{ root }}/sessions">Sessões</a>{% if admin %}<a href="{{ root }}/users">Usuários</a>{% endif %}<a href="{{ root }}/keys">Conexão MCP</a><a href="{{ root }}/password">Senha</a></nav>{% endif %}
{% block content %}{% endblock %}</main></body></html>
